name: codenames-embed
# Computes word vectors for codenames/ with models from the Hugging Face Hub, on a
# GitHub-hosted runner (CPU), and commits them to this branch under codenames/vectors/.
on:
  push:
    branches: ["compute/codenames-embed"]
    paths: [".github/workflows/codenames-embed.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: codenames-embed-push
  cancel-in-progress: false
jobs:
  embed:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        model:
          # Clue words named by language models in experiment C4 that had no vectors
          # (codenames/c4-words.txt), appended to each model's files.
          - Qwen/Qwen3-Embedding-0.6B
          - microsoft/harrier-oss-v1-270m
          - microsoft/harrier-oss-v1-0.6b
          - google/embeddinggemma-2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Embed the vocabulary
        env:
          MODEL: ${{ matrix.model }}
        run: |
          uv run --group codenames --with "sentence-transformers>=5" --with torch --with torchvision --with pillow \
            python -c "import os; from codenames.embed import vectors; words = open('codenames/c4-words.txt').read().split(); [print(t, vectors(os.environ['MODEL'], words, t).shape) for t in ('bare', 'related', 'query')]"
          ls -l codenames/vectors
      - name: Commit the vectors to this branch
        run: |
          git config user.name arclabs561
          git config user.email arclabs561@users.noreply.github.com
          git add codenames/vectors
          git commit -q -m "codenames: vectors of the C4 clue words for ${{ matrix.model }}"
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && break; sleep 10; done
