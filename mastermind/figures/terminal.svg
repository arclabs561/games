<svg xmlns="http://www.w3.org/2000/svg" width="640" height="330" viewBox="0 0 640 330" role="img" font-family="Helvetica, Arial, sans-serif">
<title>A terminal screen of 18 five-letter words, and the helper&#x27;s guesses</title>
<desc>A dark terminal panel lists 18 words in two columns. The log on the right shows the helper&#x27;s guesses PLANT, QUEEN and RIVER with likeness 0, 1 and 2, after which one candidate, WATER, is left: the password, entered with the fourth and last attempt.</desc>
