name: Rebuild Codenames diagnostics
on:
  push:
    branches: [compute/c10-replayed-diagnostics]
permissions:
  contents: read
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          python-version: "3.12"
      - name: Restore published word vectors
        run: |
          git fetch --depth=1 origin d99ed32e24df9d500a5d7d488d8a2edda2bdda71
          git restore --source=FETCH_HEAD --worktree -- codenames/vectors/
      - name: Rebuild reports from corrected C10 scores
        run: |
          uv sync --locked --group codenames
          uv run python -m codenames.diagnose legality
          uv run python -m codenames.diagnose slices
          uv run python -m codenames.diagnose disagree
          uv run python -m codenames.diagnose case C10 41 --out codenames/results/diagnostics/cases/c10-041.md > /dev/null
          uv run pytest -q tests/test_codenames_diagnose.py
      - name: Export reproducible report patch
        run: |
          git add -N codenames/results/diagnostics/cases/c10-243.md
          git diff --check -- codenames/results/diagnostics
          git diff --stat -- codenames/results/diagnostics
          echo BEGIN_REPORT_PATCH
          git diff --binary -- codenames/results/diagnostics | gzip -n | base64 -w 76
          echo END_REPORT_PATCH
