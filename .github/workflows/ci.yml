name: CI
permissions:
  contents: read

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest Python that pyproject.toml allows, and the newest release.
        python: ["3.12", "3.14"]
    env:
      # ty installs each PEP 723 script's dependencies with uv (a preview feature).
      TY_UV: scripts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - name: Install the locked environment
        # The CUDA build of torch (codenames-gpu) is for Hugging Face Jobs only.
        run: uv sync --locked --all-groups --no-group codenames-gpu --no-group hanabi-jax
      - name: Lint
        run: uv run ruff check
      - name: Format check
        run: uv run ruff format --check
      - name: Type check
        run: uv run ty check
      - name: Tests
        run: uv run pytest
      - name: Notebooks reproduce their committed text and figures
        run: uv run pytest -p tests.nbval_figures --nbval --nbval-current-env --nbval-sanitize-with tests/nbval_sanitize.cfg $(git ls-files '*.ipynb')
      - name: Script lock files are current
        run: for lock in $(git ls-files '*.py.lock'); do uv lock --script "${lock%.lock}" --check; done
      - name: Check the paper's lemmas (a PEP 723 script)
        run: uv run erase/smt/z3_lemmas.py

  papers:
    # Rebuild every Typst PDF and fail if any differs from the committed file. The build
    # uses only Typst's own fonts and those committed beside a paper, and no PDF records
    # its build date, so the same source gives the same bytes on any machine.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
      - name: Rebuild the PDFs
        run: |
          uv run tools/typst_vendor.py cannonballs/cannonballs.typ --all
          uv run tools/typst_vendor.py erase/paper/erase.typ --all
          uv run tools/typst_vendor.py peggle/peggle.typ --all
          uv run tools/typst_vendor.py tenzi/tenzi.typ --all
      - name: The committed PDFs are current
        run: git diff --exit-code --stat -- '*.pdf'
