# Compare the bits of every maps computation across runner types (scratch branch only).
name: maps-repro
permissions:
  contents: read
on:
  push:
    branches: [compute/maps-repro]
jobs:
  probe:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-latest, ubuntu-latest, ubuntu-latest, ubuntu-latest, ubuntu-22.04, ubuntu-24.04-arm, windows-latest, macos-latest]
        idx: [0]
        include:
          - {os: ubuntu-latest, idx: 1}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
      - name: CPU
        shell: bash
        run: |
          (lscpu 2>/dev/null | grep -E "Model name|Flags" | cut -c1-400) || true
          (sysctl -n machdep.cpu.brand_string 2>/dev/null) || true
          (powershell -Command "(Get-CimInstance Win32_Processor).Name" 2>/dev/null) || true
          uname -a; (ldd --version 2>/dev/null | head -1) || true
      - name: Probe the fix
        shell: bash
        run: |
          uv sync --locked --group maps
          uv run --group maps python -c "import numpy; numpy.show_runtime()"
          uv run --group maps python maps_probe/probe.py --full | tee "$RUNNER_TEMP/fix.txt"
