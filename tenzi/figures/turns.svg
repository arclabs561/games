<text x="269.39" y="326" font-size="11" fill="#52514e" text-anchor="middle">20</text>
<text x="379.59" y="326" font-size="11" fill="#52514e" text-anchor="middle">30</text>
<text x="489.8" y="326" font-size="11" fill="#52514e" text-anchor="middle">40</text>
<text x="600" y="326" font-size="11" fill="#52514e" text-anchor="middle">50</text>
<text x="330" y="346" font-size="12" fill="#52514e" text-anchor="middle">turn on which the game ends (the first roll is turn 1)</text>
<text x="10" y="20" font-size="12" fill="#52514e">chance</text>
