<svg xmlns="http://www.w3.org/2000/svg" width="630" height="360" viewBox="0 0 630 360" role="img" font-family="Helvetica, Arial, sans-serif">
<title>The chance that a game of Tenzi ends on each turn, for three rules</title>
<desc>Three exact distributions over turns 1 to 50. Keeping the most common face and switching to a larger group both peak at turn 12; naming the face before the first roll shifts the curve later. Means: 15.35, 15.29 and 16.56 turns.</desc>
