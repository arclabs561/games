<text x="52" y="134" font-size="11" fill="#52514e" text-anchor="end">0.06</text>
<line x1="60" y1="70" x2="600" y2="70" stroke="#d9d8d4"/>
<text x="52" y="74" font-size="11" fill="#52514e" text-anchor="end">0.08</text>
<text x="60" y="326" font-size="11" fill="#52514e" text-anchor="middle">1</text>
