[project]
name = "games"
version = "0.1.0"
description = "Game analyses, solvers, and simulations."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []

# Each game is a package; run one with `uv run python -m <package>.<module>`. Its
# third-party packages are a dependency group named after its folder:
#   uv run --group boggle --with jupyter jupyter lab boggle/boggle.ipynb
# The Erase scripts stay standalone; the ones that need packages declare them inline
# (PEP 723). CI installs every group so that ty can check everything.

[dependency-groups]
dev = [
    "ipykernel>=7",
    "nbclient>=0.11",
    "nbval>=0.11",
    "pytest>=9.2",
    "ruff>=0.17",
    "ty>=0.0.105",
]
boggle = [
    "matplotlib>=3.11",
    "numpy>=2.5",
    "seaborn>=0.13.2",
    "tabulate>=0.10",
    "wordfreq==3.1.1",
]
codenames = [
    "numpy>=2.5",
    "onnxruntime>=1.32",
    "tokenizers>=0.23",
    "wordfreq==3.1.1",
]
drive_ya_nuts = [
    "numpy>=2.5",
]
ev_nova = [
    "numpy>=2.5",
]
hanabi = [
    "huggingface-hub>=2.4",
]
egyptian_ratscrew = [
    "matplotlib>=3.11",
    "numpy>=2.5",
    "seaborn>=0.13.2",
]
mastermind = [
    "matplotlib>=3.11",
    "numpy>=2.5",
]
pokemon = [
    "matplotlib>=3.11",
    "networkx>=3.7",
    "numpy>=2.5",
    "pandas>=3.1",
    "scikit-learn>=1.9",
    "scipy>=1.18",
    "seaborn>=0.13.2",
]
tenzi = [
    "matplotlib>=3.11",
    "numpy>=2.5",
    "scipy>=1.18",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = ["boggle", "codenames", "drive_ya_nuts", "egyptian_ratscrew", "ev_nova", "hanabi", "mastermind", "peggle", "pokemon", "tenzi"]

[tool.ruff]
line-length = 100

[tool.ruff.format]
exclude = ["*.ipynb"]  # lint the notebooks, but keep their authors' formatting

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "UP", "W"]
ignore = ["E501"]  # line length is left to the formatter

[tool.ty.environment]
extra-paths = ["erase"]  # the Erase scripts import each other by bare name

[tool.pytest]
testpaths = ["tests"]
pythonpath = ["erase"]  # the Erase scripts are not a package
strict = true
