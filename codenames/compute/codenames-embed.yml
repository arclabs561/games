name: codenames-embed
# A copy of the workflow that computed the Hugging Face vectors, on the branch
# compute/codenames-embed. It is inert here; to use it, put it under .github/workflows/
# on a branch named compute/<something> and change the branch name below.
#
# Computes word vectors for codenames/ with models from the Hugging Face Hub, on a
# GitHub-hosted runner (CPU), and commits them to this branch under codenames/vectors/.
#
# Changed on 2026-11-20 from the copy that ran on 2026-11-18 and 2026-11-19. That copy gave
# the whole workflow write access and installed the latest sentence-transformers, torch,
# torchvision and Pillow in the job that held the token. Here the job that runs those
# packages can only read, and its packages are pinned (the versions of uv.lock, with the
# torchvision that resolves beside them on 2026-11-19); the versions that ran then were
# not recorded. A separate job with write access, which runs no package, commits the
# vectors. The models are still read at the Hub's latest revision.
on:
  push:
    branches: ["compute/codenames-embed"]
    paths: [".github/workflows/codenames-embed.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: codenames-embed-push
  cancel-in-progress: false
jobs:
  embed:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {model: Qwen/Qwen3-Embedding-0.6B, name: qwen3-embedding-0.6b}
          - {model: microsoft/harrier-oss-v1-270m, name: harrier-oss-v1-270m}
          - {model: microsoft/harrier-oss-v1-0.6b, name: harrier-oss-v1-0.6b}
          - {model: google/embeddinggemma-2, name: embeddinggemma-2}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Embed the vocabulary
        env:
          MODEL: ${{ matrix.model }}
        run: |
          uv run --locked --group codenames --with sentence-transformers==6.3.0 \
            --with torch==2.15.0 --with torchvision==0.29.2 --with pillow==13.0.0 \
            python -m codenames.embed --model "$MODEL" --template bare related query \
            --out-dir "$RUNNER_TEMP/vectors"
          ls -l "$RUNNER_TEMP/vectors"
      # The vectors are this repository's own output, committed to a public branch below.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vectors-${{ matrix.name }}
          path: ${{ runner.temp }}/vectors
          retention-days: 3

  commit:
    needs: embed
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The only job that pushes; it runs git and the artifacts, no packages.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vectors-*
          merge-multiple: true
          path: codenames/vectors
      - name: Commit the vectors to this branch
        run: |
          git config user.name arclabs561
          git config user.email arclabs561@users.noreply.github.com
          ls -l codenames/vectors
          git add codenames/vectors
          git commit -q -m "codenames: vectors from run $GITHUB_RUN_ID"
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && break; sleep 10; done
