<rect x="212" y="152.35" width="15" height="17.65" fill="#2a78d6"/>
<rect x="228" y="170" width="15" height="1.43" fill="#1a9a6c"/>
<text x="220" y="286" font-size="10" fill="#52514e" text-anchor="middle">1400-1800</text>
