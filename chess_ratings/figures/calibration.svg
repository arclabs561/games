<rect x="526" y="152.5" width="15" height="117.5" fill="#d95926"/>
<rect x="542" y="102.5" width="15" height="167.5" fill="#2a78d6"/>
<rect x="558" y="92.5" width="15" height="177.5" fill="#1a9a6c"/>
<text x="550" y="286" font-size="10" fill="#52514e" text-anchor="middle">1000-1400</text>
<rect x="586" y="112.5" width="15" height="157.5" fill="#d95926"/>
<rect x="602" y="82.5" width="15" height="187.5" fill="#2a78d6"/>
