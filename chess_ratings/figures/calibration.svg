<rect x="348" y="170" width="15" height="0.8" fill="#1a9a6c"/>
<text x="340" y="286" font-size="10" fill="#52514e" text-anchor="middle">2200-2700</text>
<text x="220" y="310" font-size="12" fill="#52514e" text-anchor="middle">estimate minus rating, 200 player-games a band</text>
<text x="460" y="26" font-size="14" font-weight="bold" fill="#0b0b0b">95% intervals that hold the rating</text>
<line x1="460" y1="270" x2="760" y2="270" stroke="#d9d8d4"/>
