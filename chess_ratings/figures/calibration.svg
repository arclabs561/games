<svg xmlns="http://www.w3.org/2000/svg" width="770" height="340" viewBox="0 0 770 340" role="img" font-family="Helvetica, Arial, sans-serif">
<title>The rating from one game on held-out August 2025 games: bias and coverage by band</title>
<desc>Left: by rating band, the mean error (estimate minus rating) of the old method, of the tempered likelihood and of the rating map with tempering. Right: the share of 95% intervals that hold the rating, with a dashed line at 95%. old method: errors +174, +158, +43, -1, -31, coverage 85%, 84%, 92%, 88%, 96%; likelihood tempered: errors +202, +182, +53, +19, +30, coverage 96%, 94%, 98%, 96%, 100%; rating map, tempered: errors +81, +95, -4, -24, -2, coverage 98%, 96%, 96%, 95%, 100%</desc>
<rect width="770" height="340" fill="#ffffff"/>
<rect x="80" y="42" width="12" height="12" fill="#d95926"/>
<text x="98" y="52" font-size="12" fill="#0b0b0b">old method</text>
<rect x="290" y="42" width="12" height="12" fill="#2a78d6"/>
<text x="308" y="52" font-size="12" fill="#0b0b0b">likelihood tempered</text>
<rect x="500" y="42" width="12" height="12" fill="#1a9a6c"/>
<text x="518" y="52" font-size="12" fill="#0b0b0b">rating map, tempered</text>
<text x="70" y="26" font-size="14" font-weight="bold" fill="#0b0b0b">Mean error by rating band</text>
<line x1="70" y1="270" x2="370" y2="270" stroke="#d9d8d4"/>
<text x="62" y="274" font-size="11" fill="#52514e" text-anchor="end">-300</text>
<line x1="70" y1="220" x2="370" y2="220" stroke="#d9d8d4"/>
<text x="62" y="224" font-size="11" fill="#52514e" text-anchor="end">-150</text>
<line x1="70" y1="170" x2="370" y2="170" stroke="#d9d8d4"/>
<text x="62" y="174" font-size="11" fill="#52514e" text-anchor="end">0</text>
<line x1="70" y1="120" x2="370" y2="120" stroke="#d9d8d4"/>
<text x="62" y="124" font-size="11" fill="#52514e" text-anchor="end">+150</text>
<line x1="70" y1="70" x2="370" y2="70" stroke="#d9d8d4"/>
<text x="62" y="74" font-size="11" fill="#52514e" text-anchor="end">+300</text>
<rect x="76" y="112.09" width="15" height="57.91" fill="#d95926"/>
<rect x="92" y="102.59" width="15" height="67.41" fill="#2a78d6"/>
<rect x="108" y="142.98" width="15" height="27.02" fill="#1a9a6c"/>
<text x="100" y="286" font-size="10" fill="#52514e" text-anchor="middle">600-1000</text>
<rect x="136" y="117.24" width="15" height="52.76" fill="#d95926"/>
