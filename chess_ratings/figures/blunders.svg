<text x="478.8" y="252.11" font-size="11" fill="#2a78d6" text-anchor="middle">0.23</text>
<text x="462" y="288" font-size="12" fill="#52514e" text-anchor="middle">1800-2200</text>
<text x="462" y="304" font-size="11" fill="#52514e" text-anchor="middle">12,160 moves</text>
<rect x="538.16" y="256.73" width="33.6" height="13.27" fill="#0b0b0b"/>
