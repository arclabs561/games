<svg xmlns="http://www.w3.org/2000/svg" width="670" height="350" viewBox="0 0 670 350" role="img" font-family="Helvetica, Arial, sans-serif">
<title>How often players blunder in the 24 most common opening positions, by rating</title>
<desc>Pairs of bars for five rating bands. Dark bars: the share of moves that were blunders in Lichess blitz games, falling from about 1.5% for players rated 600 to 1000 to about 0.25% above 1800. Light bars: the share Maia-3 expected, higher than observed below 1800 and close to it above.</desc>
<rect width="670" height="350" fill="#ffffff"/>
<text x="70" y="26" font-size="14" font-weight="bold" fill="#0b0b0b">Blunders in the 24 most common opening positions (% of moves)</text>
<line x1="70" y1="270" x2="630" y2="270" stroke="#d9d8d4"/>
<text x="62" y="274" font-size="11" fill="#52514e" text-anchor="end">0%</text>
<line x1="70" y1="215" x2="630" y2="215" stroke="#d9d8d4"/>
<text x="62" y="219" font-size="11" fill="#52514e" text-anchor="end">1%</text>
<line x1="70" y1="160" x2="630" y2="160" stroke="#d9d8d4"/>
<text x="62" y="164" font-size="11" fill="#52514e" text-anchor="end">2%</text>
<line x1="70" y1="105" x2="630" y2="105" stroke="#d9d8d4"/>
<text x="62" y="109" font-size="11" fill="#52514e" text-anchor="end">3%</text>
<line x1="70" y1="50" x2="630" y2="50" stroke="#d9d8d4"/>
<text x="62" y="54" font-size="11" fill="#52514e" text-anchor="end">4%</text>
<rect x="90.16" y="185.66" width="33.6" height="84.34" fill="#0b0b0b"/>
<text x="106.96" y="180.66" font-size="11" fill="#0b0b0b" text-anchor="middle">1.53</text>
<rect x="126" y="82.32" width="33.6" height="187.68" fill="#2a78d6"/>
<text x="142.8" y="77.32" font-size="11" fill="#2a78d6" text-anchor="middle">3.41</text>
<text x="126" y="288" font-size="12" fill="#52514e" text-anchor="middle">600-1000</text>
<text x="126" y="304" font-size="11" fill="#52514e" text-anchor="middle">1,239 moves</text>
<rect x="202.16" y="217.35" width="33.6" height="52.65" fill="#0b0b0b"/>
<text x="218.96" y="212.35" font-size="11" fill="#0b0b0b" text-anchor="middle">0.96</text>
<rect x="238" y="187.86" width="33.6" height="82.14" fill="#2a78d6"/>
<text x="254.8" y="182.86" font-size="11" fill="#2a78d6" text-anchor="middle">1.49</text>
<text x="238" y="288" font-size="12" fill="#52514e" text-anchor="middle">1000-1400</text>
<text x="238" y="304" font-size="11" fill="#52514e" text-anchor="middle">8,566 moves</text>
<rect x="314.16" y="245.11" width="33.6" height="24.89" fill="#0b0b0b"/>
<text x="330.96" y="240.11" font-size="11" fill="#0b0b0b" text-anchor="middle">0.45</text>
<rect x="350" y="234.59" width="33.6" height="35.41" fill="#2a78d6"/>
<text x="366.8" y="229.59" font-size="11" fill="#2a78d6" text-anchor="middle">0.64</text>
<text x="350" y="288" font-size="12" fill="#52514e" text-anchor="middle">1400-1800</text>
<text x="350" y="304" font-size="11" fill="#52514e" text-anchor="middle">16,352 moves</text>
<rect x="426.16" y="256.43" width="33.6" height="13.57" fill="#0b0b0b"/>
