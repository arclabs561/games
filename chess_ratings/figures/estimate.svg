<svg xmlns="http://www.w3.org/2000/svg" width="770" height="330" viewBox="0 0 770 330" role="img" font-family="Helvetica, Arial, sans-serif">
<title>How well Maia-3 guesses a rating from one game</title>
<desc>Left: the mean absolute error of the estimate, in rating points, using a player&#x27;s first 5, 10, 20, 30 or 40 moves of a game: 331, 263, 215, 193 and 174. Right: by rating band, the mean error (estimate minus rating), from about +200 below 1400 to about -30 above 2200; Maia-3 rates weaker players&#x27; moves as stronger than their ratings.</desc>
<rect width="770" height="330" fill="#ffffff"/>
<text x="70" y="28" font-size="14" font-weight="bold" fill="#0b0b0b">Mean absolute error by moves used</text>
<line x1="70" y1="250" x2="370" y2="250" stroke="#d9d8d4"/>
<text x="62" y="254" font-size="11" fill="#52514e" text-anchor="end">0</text>
<line x1="70" y1="210" x2="370" y2="210" stroke="#d9d8d4"/>
<text x="62" y="214" font-size="11" fill="#52514e" text-anchor="end">100</text>
<line x1="70" y1="170" x2="370" y2="170" stroke="#d9d8d4"/>
<text x="62" y="174" font-size="11" fill="#52514e" text-anchor="end">200</text>
<line x1="70" y1="130" x2="370" y2="130" stroke="#d9d8d4"/>
<text x="62" y="134" font-size="11" fill="#52514e" text-anchor="end">300</text>
<line x1="70" y1="90" x2="370" y2="90" stroke="#d9d8d4"/>
<text x="62" y="94" font-size="11" fill="#52514e" text-anchor="end">400</text>
<line x1="70" y1="50" x2="370" y2="50" stroke="#d9d8d4"/>
<text x="62" y="54" font-size="11" fill="#52514e" text-anchor="end">500</text>
<circle cx="70" cy="117.46" r="3.5" fill="#2a78d6"/>
<text x="70" y="108.46" font-size="11" fill="#2a78d6" text-anchor="middle">331</text>
<text x="70" y="266" font-size="11" fill="#52514e" text-anchor="middle">5</text>
<text x="70" y="280" font-size="10" fill="#52514e" text-anchor="middle">n=500</text>
<circle cx="145" cy="144.87" r="3.5" fill="#2a78d6"/>
<text x="145" y="135.87" font-size="11" fill="#2a78d6" text-anchor="middle">263</text>
<text x="145" y="266" font-size="11" fill="#52514e" text-anchor="middle">10</text>
<text x="145" y="280" font-size="10" fill="#52514e" text-anchor="middle">n=500</text>
<circle cx="220" cy="163.94" r="3.5" fill="#2a78d6"/>
<text x="220" y="154.94" font-size="11" fill="#2a78d6" text-anchor="middle">215</text>
<text x="220" y="266" font-size="11" fill="#52514e" text-anchor="middle">20</text>
<text x="220" y="280" font-size="10" fill="#52514e" text-anchor="middle">n=493</text>
<circle cx="295" cy="172.6" r="3.5" fill="#2a78d6"/>
<text x="295" y="163.6" font-size="11" fill="#2a78d6" text-anchor="middle">193</text>
<text x="295" y="266" font-size="11" fill="#52514e" text-anchor="middle">30</text>
<text x="295" y="280" font-size="10" fill="#52514e" text-anchor="middle">n=319</text>
<circle cx="370" cy="180.45" r="3.5" fill="#2a78d6"/>
<text x="370" y="171.45" font-size="11" fill="#2a78d6" text-anchor="middle">174</text>
<text x="370" y="266" font-size="11" fill="#52514e" text-anchor="middle">40</text>
<text x="370" y="280" font-size="10" fill="#52514e" text-anchor="middle">n=151</text>
<polyline points="70,117.46 145,144.87 220,163.94 295,172.6 370,180.45" fill="none" stroke="#2a78d6" stroke-width="2"/>
<line x1="70" y1="69.71" x2="370" y2="69.71" stroke="#d95926" stroke-dasharray="5 4"/>
<text x="370" y="83.71" font-size="11" fill="#d95926" text-anchor="end">guessing the mean: 451</text>
<text x="220" y="298" font-size="12" fill="#52514e" text-anchor="middle">moves used (the player&#x27;s own)</text>
<text x="460" y="28" font-size="14" font-weight="bold" fill="#0b0b0b">Mean error by rating band</text>
<line x1="460" y1="250" x2="760" y2="250" stroke="#d9d8d4"/>
<text x="452" y="254" font-size="11" fill="#52514e" text-anchor="end">-300</text>
<line x1="460" y1="200" x2="760" y2="200" stroke="#d9d8d4"/>
<text x="452" y="204" font-size="11" fill="#52514e" text-anchor="end">-150</text>
<line x1="460" y1="150" x2="760" y2="150" stroke="#d9d8d4"/>
<text x="452" y="154" font-size="11" fill="#52514e" text-anchor="end">0</text>
<line x1="460" y1="100" x2="760" y2="100" stroke="#d9d8d4"/>
<text x="452" y="104" font-size="11" fill="#52514e" text-anchor="end">+150</text>
<line x1="460" y1="50" x2="760" y2="50" stroke="#d9d8d4"/>
<text x="452" y="54" font-size="11" fill="#52514e" text-anchor="end">+300</text>
<rect x="472" y="81.29" width="36" height="68.71" fill="#2a78d6"/>
<text x="490" y="75.29" font-size="11" fill="#2a78d6" text-anchor="middle">+206</text>
<text x="490" y="266" font-size="10" fill="#52514e" text-anchor="middle">600-1000</text>
<rect x="532" y="83.53" width="36" height="66.47" fill="#2a78d6"/>
<text x="550" y="77.53" font-size="11" fill="#2a78d6" text-anchor="middle">+199</text>
<text x="550" y="266" font-size="10" fill="#52514e" text-anchor="middle">1000-1400</text>
<rect x="592" y="122.68" width="36" height="27.32" fill="#2a78d6"/>
<text x="610" y="116.68" font-size="11" fill="#2a78d6" text-anchor="middle">+82</text>
<text x="610" y="266" font-size="10" fill="#52514e" text-anchor="middle">1400-1800</text>
<rect x="652" y="150" width="36" height="1.73" fill="#2a78d6"/>
<text x="670" y="166.73" font-size="11" fill="#2a78d6" text-anchor="middle">-5</text>
<text x="670" y="266" font-size="10" fill="#52514e" text-anchor="middle">1800-2200</text>
<rect x="712" y="150" width="36" height="10.25" fill="#2a78d6"/>
<text x="730" y="175.25" font-size="11" fill="#2a78d6" text-anchor="middle">-31</text>
<text x="730" y="266" font-size="10" fill="#52514e" text-anchor="middle">2200-2700</text>
<text x="610" y="298" font-size="12" fill="#52514e" text-anchor="middle">estimate minus rating, 100 players a band</text>
</svg>
