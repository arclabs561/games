<svg xmlns="http://www.w3.org/2000/svg" width="660" height="440" viewBox="0 0 660 440" role="img" font-family="Helvetica, Arial, sans-serif">
<title>EV Nova&#x27;s best trade routes on a schematic map</title>
<desc>Systems are circles, with their trading stops named inside. Lines join the stops of the best routes, labeled with the jumps per leg. Kania to Altair and Dani Fort to Dani are one jump and earn 217 credits per ton per jump. Sol to Kania is two jumps, Sol to Tuatha three. The two stations of Ver&#x27;ashan are in one system, no jump apart.</desc>
<rect width="660" height="440" fill="#ffffff"/>
<line x1="330" y1="90" x2="470" y2="60" stroke="#2a78d6" stroke-width="3"/>
<rect x="370" y="65" width="60" height="18" rx="9" fill="#ffffff" stroke="#2a78d6"/>
<text x="400" y="78" font-size="11" fill="#0b0b0b" text-anchor="middle">1 jump</text>
<line x1="430" y1="290" x2="560" y2="230" stroke="#2a78d6" stroke-width="3"/>
<rect x="465" y="250" width="60" height="18" rx="9" fill="#ffffff" stroke="#2a78d6"/>
<text x="495" y="263" font-size="11" fill="#0b0b0b" text-anchor="middle">1 jump</text>
<line x1="330" y1="90" x2="150" y2="150" stroke="#2a78d6" stroke-width="3" stroke-dasharray="7 5"/>
<rect x="210" y="110" width="60" height="18" rx="9" fill="#ffffff" stroke="#2a78d6"/>
<text x="240" y="123" font-size="11" fill="#0b0b0b" text-anchor="middle">2 jumps</text>
<line x1="150" y1="150" x2="70" y2="320" stroke="#2a78d6" stroke-width="3" stroke-dasharray="7 5"/>
<rect x="80" y="225" width="60" height="18" rx="9" fill="#ffffff" stroke="#2a78d6"/>
<text x="110" y="238" font-size="11" fill="#0b0b0b" text-anchor="middle">3 jumps</text>
<line x1="430" y1="290" x2="560" y2="350" stroke="#d95926" stroke-width="3"/>
<rect x="465" y="310" width="60" height="18" rx="9" fill="#ffffff" stroke="#d95926"/>
<text x="495" y="323" font-size="11" fill="#0b0b0b" text-anchor="middle">1 jump</text>
<circle cx="150" cy="150" r="36" fill="#f4f3ef" stroke="#0b0b0b" stroke-width="1.5"/>
<text x="150" y="108" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b0b0b">Sol</text>
<text x="150" y="147" font-size="11" fill="#52514e" text-anchor="middle">Earth</text>
<text x="150" y="161" font-size="11" fill="#52514e" text-anchor="middle">Europa</text>
<circle cx="330" cy="90" r="30" fill="#f4f3ef" stroke="#0b0b0b" stroke-width="1.5"/>
<text x="330" y="54" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b0b0b">Kania</text>
<text x="330" y="94" font-size="11" fill="#52514e" text-anchor="middle">Port Kane</text>
<circle cx="470" cy="60" r="30" fill="#f4f3ef" stroke="#0b0b0b" stroke-width="1.5"/>
<text x="470" y="24" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b0b0b">Altair</text>
<text x="470" y="64" font-size="11" fill="#52514e" text-anchor="middle">Altia</text>
<circle cx="70" cy="320" r="30" fill="#f4f3ef" stroke="#0b0b0b" stroke-width="1.5"/>
<text x="70" y="366" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b0b0b">Tuatha</text>
<text x="70" y="324" font-size="11" fill="#52514e" text-anchor="middle">New Ireland</text>
<circle cx="430" cy="290" r="30" fill="#f4f3ef" stroke="#0b0b0b" stroke-width="1.5"/>
<text x="430" y="254" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b0b0b">Dani Fort</text>
<text x="430" y="294" font-size="11" fill="#52514e" text-anchor="middle">Forticus</text>
<circle cx="560" cy="230" r="30" fill="#f4f3ef" stroke="#0b0b0b" stroke-width="1.5"/>
<text x="560" y="194" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b0b0b">Dani</text>
<text x="560" y="234" font-size="11" fill="#52514e" text-anchor="middle">Dani</text>
<circle cx="560" cy="350" r="30" fill="#f4f3ef" stroke="#0b0b0b" stroke-width="1.5"/>
<text x="560" y="314" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b0b0b">Dani Evera</text>
<text x="560" y="354" font-size="11" fill="#52514e" text-anchor="middle">Palein</text>
<circle cx="250" cy="330" r="36" fill="#f4f3ef" stroke="#0b0b0b" stroke-width="1.5"/>
