<text x="250" y="382" font-size="11" fill="#52514e" text-anchor="middle">two stations, no jump</text>
<text x="250" y="327" font-size="11" fill="#52514e" text-anchor="middle">Ver&#x27;ar Shan</text>
<text x="250" y="341" font-size="11" fill="#52514e" text-anchor="middle">Ver&#x27;ar Sho</text>
<line x1="20" y1="410" x2="50" y2="410" stroke="#2a78d6" stroke-width="3"/>
<text x="56" y="414" font-size="12" fill="#52514e">on the wiki&#x27;s route pages</text>
<line x1="230" y1="410" x2="260" y2="410" stroke="#d95926" stroke-width="3"/>
<text x="266" y="414" font-size="12" fill="#52514e">equal best round trip, not listed</text>
<text x="20" y="432" font-size="12" fill="#52514e">Schematic: positions are not the game&#x27;s. A dashed line passes systems not drawn.</text>
</svg>
